[package]
name = "notchdeck-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust core for NotchDeck: system stats, clipboard history, file shelf and focus timer exposed over a C ABI."

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.0", default-features = false, features = ["system", "network"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
